name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Tests
        run: cargo test
      # Reports lints without failing the build: CLAUDE.md lists a few known
      # warnings in existing code that are fixed only when that code changes.
      - name: Clippy
        run: cargo clippy --all-targets
