<svg xmlns="http://www.w3.org/2000/svg" width="491" height="294" viewBox="0 0 491 294" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<rect width="491" height="294" rx="10" fill="#1e1f29"/>
<text x="24" y="30" fill="#c8cbe0" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Escapes and mistakes show as written</text>
