<svg xmlns="http://www.w3.org/2000/svg" width="1054" height="294" viewBox="0 0 1054 294" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<rect width="1054" height="294" rx="10" fill="#1e1f29"/>
<text x="24" y="30" fill="#c8cbe0" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Colours</text>
<text x="24" y="56" fill="#9aa0b4" font-size="12" font-family="Helvetica, Arial, sans-serif">you write</text>
<text x="727.6" y="56" fill="#9aa0b4" font-size="12" font-family="Helvetica, Arial, sans-serif">the terminal shows</text>
<rect x="12" y="74" width="1030" height="34" rx="4" fill="#272936"/>
<text x="24" y="96.0" fill="#9aa0b4" xml:space="preserve">{red|red} {green|green} {yellow|yellow} {blue|blue} {purple|purple} {cyan|cyan}</text>
<text x="727.6" y="96.0" xml:space="preserve"><tspan fill="#ff5c57">red</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#5af78e">green</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#f3f99d">yellow</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#57c7ff">blue</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#ff6ac1">purple</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#9aedfe">cyan</tspan></text>
<text x="24" y="130.0" fill="#9aa0b4" xml:space="preserve">{bright red|bright red} {bright cyan|bright cyan} {bright white|bright white}</text>
<text x="727.6" y="130.0" xml:space="preserve"><tspan fill="#ff8a85">bright red</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#c2f4ff">bright cyan</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#ffffff">bright white</tspan></text>
<rect x="12" y="142" width="1030" height="34" rx="4" fill="#272936"/>
<text x="24" y="164.0" fill="#9aa0b4" xml:space="preserve">{grey|grey} {orange|orange} {pink|pink} {brown|brown}</text>
<text x="727.6" y="164.0" xml:space="preserve"><tspan fill="#7f8496">grey</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#ffa500">orange</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#ffc0cb">pink</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#a52a2a">brown</tspan></text>
<text x="24" y="198.0" fill="#9aa0b4" xml:space="preserve">{#f80|#f80} {#4c78a8|#4c78a8} {#B279A2|#B279A2}</text>
<text x="727.6" y="198.0" xml:space="preserve"><tspan fill="#ff8800">#f80</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#4c78a8">#4c78a8</tspan><tspan fill="#e6e6e6"> </tspan><tspan fill="#b279a2">#B279A2</tspan></text>
<rect x="12" y="210" width="1030" height="34" rx="4" fill="#272936"/>
<text x="24" y="232.0" fill="#9aa0b4" xml:space="preserve">{bright cyan|**Something answers.**} Make a *Fear Save*.</text>
<text x="727.6" y="232.0" xml:space="preserve"><tspan fill="#c2f4ff" font-weight="bold">Something answers.</tspan><tspan fill="#e6e6e6"> Make a </tspan><tspan fill="#e6e6e6" font-style="italic">Fear Save</tspan><tspan fill="#e6e6e6">.</tspan></text>
<text x="24" y="266.0" fill="#9aa0b4" xml:space="preserve">**{red|blood} and {grey|ash}**</text>
<text x="727.6" y="266.0" xml:space="preserve"><tspan fill="#ff5c57" font-weight="bold">blood</tspan><tspan fill="#e6e6e6" font-weight="bold"> and </tspan><tspan fill="#7f8496" font-weight="bold">ash</tspan></text>
</svg>
